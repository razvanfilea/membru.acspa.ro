{% let is_today = (date == current_date) %}
{% let events = events.clone() %}

{% if date.month() != view_month %}
{# Days of the adjacent months open their own month #}
<a href="/admin/calendar/{{ date.year() }}/{{ u8::from(date.month()) }}?day={{ date }}"
   class="calendar-day calendar-day-other">
{% else %}
<button id="day_{{ date }}"
        hx-get="/admin/calendar/details/{{ date }}"
        hx-target="#day_details_container"
        hx-indicator="#day_details_loading"
        hx-push-url="/admin/calendar/{{ date.year() }}/{{ u8::from(date.month()) }}?day={{ date }}"
        hx-on::before-request="selectCalendarDay(this)"
        hx-on::after-request="showDayPanel()"
        hx-swap-oob="{{ oob_swap }}"
        aria-pressed="{{ is_selected }}"
        class="calendar-day">
{% endif %}
    <span class="flex flex-col sm:flex-row items-center sm:items-start sm:justify-between gap-1 w-full">
        <span class="text-sm sm:text-base font-bold leading-none
            {% if is_today %} underline decoration-2 underline-offset-1 sm:underline-offset-4{% endif %}">
            {{ date.day() }}
        </span>
        <span class="flex gap-0.5 sm:gap-1 h-1.5 sm:h-2 sm:mt-0.5">
            {% if events.has_holiday %}<span class="event-dot event-holiday" title="Zi liberă"></span>{% endif %}
            {% if events.has_restriction %}<span class="event-dot event-restriction" title="Restricții"></span>{% endif %}
            {% if events.has_tournament %}<span class="event-dot event-tournament" title="Turneu"></span>{% endif %}
            {% if events.guests > 0 %}<span class="event-dot event-guests" title="Invitați"></span>{% endif %}
        </span>
    </span>

    <span class="h-3.5 sm:h-5 flex items-end">
        {% if events.reservations > 0 %}
        <span class="calendar-count" title="{{ events.reservations }} rezervări">{{ events.reservations }}</span>
        {% endif %}
    </span>
{% if date.month() != view_month %}
</a>
{% else %}
</button>
{% endif %}
