{% let is_today = (date == current_date) %}
{% let events = events.clone() %}

{% if date.month() != view_month %}
{# Days of the adjacent months open their own month #}
<a href="/admin/calendar/{{ date.year() }}/{{ u8::from(date.month()) }}?day={{ date }}"
   class="calendar-day opacity-40">
{% else %}
<button id="day_{{ date }}"
        hx-get="/admin/calendar/details/{{ date }}"
        hx-target="#day_details_container"
        hx-indicator="#day_details_loading"
        hx-push-url="/admin/calendar/{{ date.year() }}/{{ u8::from(date.month()) }}?day={{ date }}"
        hx-on::before-request="selectCalendarDay(this)"
        hx-on::after-request="showDayPanel()"
        hx-swap-oob="{{ oob_swap }}"
        aria-pressed="{{ is_selected }}"
        class="calendar-day">
{% endif %}
    <span class="text-sm sm:text-lg font-bold leading-none
        {% if is_today %} flex items-center justify-center size-5 sm:size-8 rounded-full bg-primary text-primary-content{% endif %}">
        {{ date.day() }}
    </span>

    <span class="text-[10px] sm:text-xs font-mono leading-none text-base-content/60 h-2.5 sm:h-3">
        {% if events.reservations > 0 %}{{ events.reservations }}{% endif %}
    </span>

    <span class="flex gap-0.5 sm:gap-1 h-1.5 sm:h-2">
        {% if events.has_holiday %}<span class="event-dot event-holiday"></span>{% endif %}
        {% if events.has_restriction %}<span class="event-dot event-restriction"></span>{% endif %}
        {% if events.has_tournament %}<span class="event-dot event-tournament"></span>{% endif %}
        {% if events.has_guests %}<span class="event-dot event-guests"></span>{% endif %}
    </span>
{% if date.month() != view_month %}
</a>
{% else %}
</button>
{% endif %}
