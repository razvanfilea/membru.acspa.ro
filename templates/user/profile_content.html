<div class="mt-8 flex flex-col gap-6">
    <div class="flex flex-row justify-between items-center bg-base-200/50 p-4 rounded-2xl border border-base-300">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 flex items-center justify-center bg-info/10 text-info rounded-full shrink-0">
                <span class="material-symbols-outlined text-2xl">calendar_month</span>
            </div>
            <div>
                <h3 class="text-lg md:text-xl font-bold leading-tight">Rezervarile tale</h3>
                <p class="text-xs text-gray-500 hidden sm:block">Istoric rezervari</p>
            </div>
        </div>
        <button hx-get="/profile/reservations/{{ selected_year }}?show_cancelled={{ show_cancelled }}"
                hx-target="#reservations-container" hx-swap="outerHTML"
                class="btn btn-circle btn-ghost" title="Refresh">
            <span class="material-symbols-outlined">refresh</span>
        </button>
    </div>

    <div id="reservations" class="flex flex-col gap-4">
        {% let allow_reservation_cancellation = true %}
        {% let admin_reservations_view = false %}
        {% include "components/reservations_with_year_selector.html" %}
    </div>

</div>
