<div hx-swap-oob="beforeend:#errors-list">
    <div role="status" class="alert alert-success bubble-auto-dismiss" onanimationend="this.remove()">
        <span class="material-symbols-outlined h-6 w-6 shrink-0">check_circle</span>

        <span>{{ message }}</span>

        <button class="btn btn-sm" onclick="this.parentNode.outerHTML = ''">X</button>
    </div>
</div>
