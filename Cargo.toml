[package]
name = "acspa"
version = "3.3.0"
edition = "2024"

[dependencies]
# Async
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

# Axum
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["trace", "timeout", "fs", "catch-panic"] }
askama = { version = "0.16" }
axum-login = { git = "https://github.com/maxcountryman/axum-login", rev = "151c72d7a1b4646830f86b4332e6bd6e34d719a7" }
axum-extra = { version = "0.12", default-features = false, features = ["form"] }

# Database
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "time"] }
tower-sessions-sqlx-store = { git = "https://github.com/maxcountryman/tower-sessions-stores", rev = "d18c9bf76f1d4fb73130dbe5aa643197f14b5d2d", features = ["sqlite"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
dotenvy = "0.15"
email_address = "0.2"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"
itertools = "0.15"
argon2 = { version = "0.6.0" }

[profile.dev.package.askama_derive]
opt-level = 3

[profile.dev.package.sqlx-macros]
opt-level = 3
